# market-maven runtime stack. Images are built and released by `deploy.sh`; this
# file never builds.
#
# `IMAGE_TAG` defaults to `current`, the tag `deploy.sh` moves on every release, so
# plain `docker compose ps|logs|restart` always address the live release.
# Runtime secrets come from `.env`. A Postgres running on the host itself is
# reachable from the container as `host.docker.internal`.

x-app: &app
  env_file: ${ENV_FILE:-.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    <<: *app
    image: market-maven/web:${IMAGE_TAG:-current}
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    cpus: ${APP_CPUS:-0}
    mem_limit: ${APP_MEM:-0}
    pids_limit: 512
    healthcheck:
      # Any non-5xx proves the server and its route graph load.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot (docker mode): `docker compose run --rm migrate`. The profile keeps
  # `up` from starting it.
  migrate:
    <<: *app
    image: market-maven/migrate:${IMAGE_TAG:-current}
    restart: "no"
    profiles: [tools]
